<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: white;
    }

    .stage {
      width: 480px;
      height: 260px;
      padding: 24px;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      background: rgb(246, 248, 252);
    }

    .toggle-card {
      height: 180px;
      border: 4px solid rgb(31, 41, 55);
      border-radius: 14px;
      box-sizing: border-box;
      overflow: hidden;
      background-color: white;
    }

    #png-card {
      background-image: url("17_assets/red_2x2.png");
      background-repeat: no-repeat;
      background-size: 64px 64px;
      image-rendering: pixelated;
    }

    #png-card[data-state="off"] {
      background-position: 18px 18px;
    }

    #png-card[data-state="on"] {
      background-position: 70px 98px;
      border-color: rgb(185, 28, 28);
    }

    #svg-card {
      background: white url("30_route_map.svg") center / 190px 110px no-repeat;
    }

    #svg-card[data-state="off"] {
      clip-path: inset(0);
    }

    #svg-card[data-state="on"] {
      clip-path: inset(20px 18px);
      border-color: rgb(37, 99, 235);
    }

    #mask-card {
      background: white url("30_route_map.svg") center / 190px 110px no-repeat;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    #mask-card[data-state="off"] {
      -webkit-mask-image: linear-gradient(90deg, #000 0 100%);
      mask-image: linear-gradient(90deg, #000 0 100%);
    }

    #mask-card[data-state="on"] {
      -webkit-mask-image: linear-gradient(90deg, transparent 0 24px, #000 24px 120px, transparent 120px 100%);
      mask-image: linear-gradient(90deg, transparent 0 24px, #000 24px 120px, transparent 120px 100%);
      border-color: rgb(15, 118, 110);
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="toggle-card" id="png-card" data-state="off"></div>
    <div class="toggle-card" id="svg-card" data-state="off"></div>
    <div class="toggle-card" id="mask-card" data-state="off"></div>
  </main>
</body>
</html>
