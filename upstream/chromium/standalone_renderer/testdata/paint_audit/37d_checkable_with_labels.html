<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: #f8fafc;
    font: 16px Arial, sans-serif;
  }
  .panel {
    margin: 32px;
    padding: 18px;
    width: 320px;
    background: white;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
  }
  label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0;
  }
  input {
    width: 18px;
    height: 18px;
  }
</style>
</head>
<body>
  <div class="panel">
    <label><input data-debug-id="check" type="checkbox" checked>Approved</label>
    <label><input data-debug-id="radio" type="radio" name="status" checked>Primary</label>
  </div>
</body>
</html>
