<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: rgb(245, 248, 252);
    }

    #scroll-panel {
      width: 320px;
      height: 196px;
      margin: 24px;
      overflow: auto;
      border: 4px solid rgb(31, 41, 55);
      background: rgb(255, 255, 255);
    }

    .content {
      width: 264px;
      padding: 0 16px 16px;
    }

    #sticky-card {
      position: sticky;
      top: 0;
      width: 264px;
      height: 76px;
      border: 3px solid rgb(15, 23, 42);
      background-image: url("43aa_panel_blocks.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      z-index: 1;
    }

    .card {
      width: 264px;
      height: 112px;
      margin-top: 18px;
      border: 2px solid rgb(148, 163, 184);
      background: rgb(219, 234, 254);
    }

    .card:nth-child(2n) {
      background: rgb(254, 249, 195);
    }
  </style>
</head>
<body>
  <section id="scroll-panel" data-debug-id="scroll-panel">
    <div class="content">
      <div id="sticky-card" data-debug-id="sticky-card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </div>
  </section>
</body>
</html>
