<!doctype html>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 36px;
    background: rgb(248, 250, 252);
    color: rgb(15, 23, 42);
  }

  .card {
    width: 250px;
    padding: 16px;
    background: white;
    border: 1px solid rgb(203, 213, 225);
  }

  h1 {
    margin: 0 0 12px;
    font-size: 20px;
  }

  .frame {
    position: relative;
    width: 170px;
    height: 126px;
    padding: 14px;
    border: 4px solid rgb(15, 23, 42);
    background: rgb(241, 245, 249);
  }

  .rail {
    position: absolute;
    left: 14px;
    right: 14px;
    top: 14px;
    height: 34px;
    background: rgb(239, 68, 68);
  }

  .chip {
    position: absolute;
    right: -36px;
    bottom: 62px;
    width: 86px;
    padding: 6px 8px;
    background: rgb(15, 23, 42);
    color: white;
  }

  .caption {
    position: absolute;
    left: 14px;
    bottom: 14px;
    width: 168px;
    padding: 8px 10px;
    background: rgb(219, 234, 254);
  }
</style>
<article class="card">
  <h1>Absolute anchor</h1>
  <div class="frame">
    <div class="rail"></div>
    <div class="chip">Edge chip</div>
    <div class="caption">Anchored against the padding edge.</div>
  </div>
</article>
