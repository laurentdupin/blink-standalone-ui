<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #eef4f8;
      font-family: Arial, sans-serif;
    }
    .shell {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr) 140px;
      gap: 20px;
      margin: 0 auto;
      max-width: 760px;
      padding: 20px 0;
      width: calc(100% - 40px);
    }
    .surface {
      background: #ffffff;
      border: 1px solid #9ab0c2;
      border-radius: 6px;
      color: #1b3348;
      padding: 20px;
    }
    .nav,
    .toc,
    .main {
      display: grid;
      gap: 12px;
    }
    .main {
      min-height: 180px;
    }
  </style>
</head>
<body>
  <div class="shell" data-debug-id="shell">
    <aside class="surface nav fixture-target" data-debug-id="left">
      <span>left heading</span>
      <strong>Navigation</strong>
      <a>Overview</a>
    </aside>
    <main class="surface main" data-debug-id="main">
      <h1>Main content</h1>
      <p>Text in the center column.</p>
    </main>
    <aside class="surface toc" data-debug-id="right">
      <span>right heading</span>
      <strong>Contents</strong>
      <a>Section</a>
    </aside>
  </div>
</body>
</html>
