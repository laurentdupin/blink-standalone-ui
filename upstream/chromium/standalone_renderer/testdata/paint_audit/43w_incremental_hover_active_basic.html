<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
}

#card {
  position: absolute;
  left: 24px;
  top: 24px;
  width: 120px;
  height: 120px;
  background: #8aa2b8;
  border: 6px solid #253142;
  box-sizing: border-box;
}

#card:hover {
  background: #34c779;
}

#card:active {
  background: #e65d4f;
  border-color: #7d2019;
}
</style>
</head>
<body>
<div id="card"></div>
</body>
</html>
