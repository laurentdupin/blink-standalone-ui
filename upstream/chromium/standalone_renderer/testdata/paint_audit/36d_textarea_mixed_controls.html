<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>36d textarea mixed controls</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #eef2f6;
      color: #1f2937;
      font: 16px "Segoe UI", Tahoma, sans-serif;
      margin: 0;
      padding: 24px;
    }

    .surface {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 28px;
      width: 760px;
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      color: #475569;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    input,
    textarea {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      color: inherit;
      font: inherit;
      padding: 12px 14px;
    }

    .wide {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <section class="surface">
    <div class="grid">
      <div class="field">
        <label for="owner">Owner</label>
        <input id="owner" type="text" value="Lane West">
      </div>
      <div class="field">
        <label for="reviewer">Reviewer</label>
        <input id="reviewer" type="search" value="M. Voss">
      </div>
      <div class="field wide">
        <label for="notes">Case notes</label>
        <textarea id="notes" rows="5">Hold release until the paper packet, route overlay, and diagnostics preview all agree on the same manifest identifier.</textarea>
      </div>
    </div>
  </section>
</body>
</html>
