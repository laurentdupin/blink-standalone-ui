<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
}

.stage {
  width: 520px;
  height: 260px;
  padding: 24px;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  background: #f6f8fc;
}

.resource-card {
  height: 180px;
  border: 4px solid #253142;
  border-radius: 14px;
  box-sizing: border-box;
  overflow: hidden;
  background-color: #ffffff;
}

#png-card {
  background-image: url("17_assets/red_2x2.png");
  background-repeat: no-repeat;
  background-position: 18px 18px;
  background-size: 64px 64px;
  image-rendering: pixelated;
}

#png-card:hover {
  background-position: 74px 96px;
  border-color: #b91c1c;
}

#png-card:active {
  background-position: 42px 56px;
  background-size: 92px 92px;
  border-color: #7f1d1d;
}

#svg-card {
  background: #ffffff url("30_route_map.svg") center / 190px 110px no-repeat;
  clip-path: inset(0);
}

#svg-card:hover {
  background-position: 18px 22px;
  background-size: 160px 94px;
  border-color: #2563eb;
}

#svg-card:active {
  background-position: 42px 48px;
  background-size: 220px 128px;
  clip-path: inset(20px 18px);
  border-color: #1d4ed8;
}

#mask-card {
  background-color: #ffffff;
  background-image: url("17_assets/red_2x2.png");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 112px 96px;
  image-rendering: pixelated;
  -webkit-mask-image: linear-gradient(90deg, #000 0 100%);
  mask-image: linear-gradient(90deg, #000 0 100%);
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
}

#mask-card:hover {
  -webkit-mask-image: linear-gradient(90deg, transparent 0 24px, #000 24px 126px, transparent 126px 100%);
  mask-image: linear-gradient(90deg, transparent 0 24px, #000 24px 126px, transparent 126px 100%);
  border-color: #0f766e;
}

#mask-card:active {
  background-position: 26px 36px;
  background-size: 96px 112px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0 42px, #000 42px 100%);
  mask-image: linear-gradient(90deg, transparent 0 42px, #000 42px 100%);
  border-color: #115e59;
}
</style>
</head>
<body>
<main class="stage">
  <div class="resource-card" id="png-card"></div>
  <div class="resource-card" id="svg-card"></div>
  <div class="resource-card" id="mask-card"></div>
</main>
</body>
</html>
