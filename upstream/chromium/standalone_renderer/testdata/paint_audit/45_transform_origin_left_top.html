<!doctype html>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: white;
  }
  .stage {
    position: relative;
    width: 240px;
    height: 170px;
    margin: 24px;
    overflow: hidden;
    border: 1px solid rgb(210, 218, 214);
    border-radius: 18px;
    background: rgb(246, 249, 246);
  }
  .chip {
    width: 52px;
    height: 52px;
    margin: 24px;
    border-radius: 14px;
    background: rgb(255, 118, 73);
    transform-origin: left top;
    transform: scale(2);
  }
</style>
<div class="stage">
  <div class="chip"></div>
</div>
