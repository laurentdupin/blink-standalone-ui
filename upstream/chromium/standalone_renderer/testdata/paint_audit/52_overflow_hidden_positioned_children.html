<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 24px;
      background: #f8fafc;
      color: #0f172a;
      font-family: Arial, sans-serif;
    }

    .row {
      display: flex;
      gap: 24px;
    }

    .card {
      width: 260px;
      padding: 16px;
      border: 1px solid #cbd5e1;
      background: white;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .frame {
      position: relative;
      width: 200px;
      height: 110px;
      padding: 12px;
      border: 4px solid #0f172a;
      background: #f1f5f9;
    }

    .hidden {
      overflow: hidden;
    }

    .strip {
      position: absolute;
      left: 12px;
      top: 12px;
      width: 320px;
      height: 44px;
      background: #ef4444;
    }

    .label {
      position: absolute;
      left: 24px;
      bottom: 12px;
      width: 300px;
      padding: 8px 10px;
      background: #bfdbfe;
      color: #1e293b;
    }

    .chip {
      position: absolute;
      right: -42px;
      bottom: 20px;
      width: 90px;
      padding: 6px 8px;
      background: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <main class="row">
    <section class="card">
      <h2>Visible</h2>
      <div class="frame">
        <div class="strip"></div>
        <div class="label">Visible overflow stays visible.</div>
        <div class="chip">Edge note</div>
      </div>
    </section>
    <section class="card">
      <h2>Hidden</h2>
      <div class="frame hidden">
        <div class="strip"></div>
        <div class="label">Hidden overflow must be clipped.</div>
        <div class="chip">Edge note</div>
      </div>
    </section>
  </main>
</body>
</html>
