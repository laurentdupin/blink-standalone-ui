<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: rgb(250, 248, 243);
    }

    .page {
      width: 560px;
      min-height: 980px;
      padding: 40px;
    }

    .spacer {
      height: 640px;
    }

    .stage {
      position: relative;
      width: 340px;
      height: 156px;
      overflow: hidden;
      opacity: 0.55;
      background: rgb(236, 230, 221);
    }

    .fill {
      width: 468px;
      height: 156px;
      background: rgb(58, 109, 246);
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="spacer"></div>
    <div class="stage">
      <div class="fill"></div>
    </div>
  </main>
</body>
</html>
