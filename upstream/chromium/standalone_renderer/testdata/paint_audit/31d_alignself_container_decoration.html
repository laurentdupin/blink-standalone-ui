<!doctype html>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: rgb(247, 241, 229);
    color: rgb(49, 39, 28);
    font-family: Georgia, "Times New Roman", serif;
  }
  .target {
    align-items: flex-start;
    background: linear-gradient(180deg, rgb(249, 237, 214), rgb(242, 224, 194));
    border: 2px dashed rgb(170, 138, 93);
    border-radius: 16px;
    display: flex;
    gap: 14px;
    margin: 24px;
    min-height: 130px;
    padding: 14px;
    width: 916px;
  }
  .chip {
    border: 2px solid rgba(53, 34, 23, 0.2);
    border-radius: 999px;
    color: white;
    font-size: 18px;
    min-width: 88px;
    padding: 12px 18px;
    text-align: center;
  }
  .start { background-color: rgb(170, 67, 61); }
  .center {
    align-self: center;
    background-color: rgb(62, 112, 189);
  }
  .end {
    align-self: flex-end;
    background-color: rgb(72, 139, 95);
  }
  .stretch {
    align-self: stretch;
    background-color: rgb(124, 82, 171);
    min-width: 0;
    padding-bottom: 0;
    padding-top: 0;
  }
</style>
<div class="target" data-debug-id="target">
  <article class="chip start">Start</article>
  <article class="chip center">Center</article>
  <article class="chip end">End</article>
  <article class="chip stretch">Stretch</article>
</div>
