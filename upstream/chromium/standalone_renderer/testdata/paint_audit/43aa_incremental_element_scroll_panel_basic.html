<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: rgb(245, 248, 252);
    }

    #scroll-panel {
      width: 300px;
      height: 180px;
      margin: 24px;
      overflow: auto;
      border: 4px solid rgb(31, 41, 55);
      background: white;
      box-sizing: border-box;
    }

    .content {
      display: grid;
      gap: 18px;
      width: 244px;
      padding: 16px;
    }

    .card {
      width: 244px;
      height: 118px;
      border: 2px solid rgb(148, 163, 184);
      overflow: hidden;
      box-sizing: border-box;
      background-color: white;
    }

    #png-card {
      background-image: url("17_assets/red_2x2.png");
      background-repeat: repeat;
      background-size: 28px 28px;
      image-rendering: pixelated;
    }

    #svg-card {
      background-image: url("43aa_panel_blocks.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 244px 118px;
    }

    #masked-card {
      background-image: url("43aa_panel_blocks.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 244px 118px;
    }
  </style>
</head>
<body>
  <section id="scroll-panel" data-debug-id="scroll-panel">
    <div class="content">
      <div class="card" id="svg-card" data-debug-id="svg-card"></div>
      <div class="card" id="masked-card" data-debug-id="masked-card"></div>
      <div class="card" id="png-card" data-debug-id="png-card"></div>
    </div>
  </section>
</body>
</html>
