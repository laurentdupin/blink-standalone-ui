<!doctype html>
<meta charset="utf-8">
<style>
body { margin: 8px; background: white; }
.hero { height: 100px; background: rgb(245,248,252); border: 1px solid rgb(210,220,230); margin-bottom: 24px; }
.layout { display: grid; grid-template-columns: 180px 180px; gap: 16px; }
.card { display: grid; overflow: hidden; border: 1px solid rgb(180,195,210); border-radius: 12px; background: rgb(247,250,252); }
.card img { display: block; max-width: 100%; height: 96px; background: rgb(233,240,246); border-bottom: 1px solid rgb(180,195,210); }
.card p { margin: 8px; font: 14px Arial; }
</style>
