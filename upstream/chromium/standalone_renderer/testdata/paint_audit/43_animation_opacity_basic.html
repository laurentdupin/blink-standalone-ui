<!doctype html>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: white;
  }
  .box {
    width: 160px;
    height: 120px;
    margin: 32px;
    background: rgb(20, 110, 220);
    animation: fade 1000ms linear forwards;
  }
  @keyframes fade {
    from { opacity: 0.2; }
    to { opacity: 1; }
  }
</style>
<div class="box"></div>
