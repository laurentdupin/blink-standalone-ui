<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: white;
    }

    #card {
      width: 160px;
      height: 96px;
      margin: 24px;
      background: white url("30_route_map.svg") center / 160px 96px no-repeat;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    #card[data-mask="wide"] {
      -webkit-mask-image: linear-gradient(90deg, #000 0 100%);
      mask-image: linear-gradient(90deg, #000 0 100%);
    }

    #card[data-mask="narrow"] {
      -webkit-mask-image: linear-gradient(90deg, transparent 0 32px, #000 32px 128px, transparent 128px 100%);
      mask-image: linear-gradient(90deg, transparent 0 32px, #000 32px 128px, transparent 128px 100%);
    }
  </style>
</head>
<body>
  <div id="card" data-mask="wide"></div>
</body>
</html>
