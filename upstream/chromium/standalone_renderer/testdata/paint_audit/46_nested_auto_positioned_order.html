<!doctype html>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: white;
  }
  .frame {
    position: relative;
    width: 178px;
    height: 126px;
    margin: 24px;
    padding: 14px;
    border: 4px solid rgb(15, 23, 42);
    background: rgb(226, 232, 240);
  }
  .anchor {
    position: relative;
    width: 84px;
    height: 84px;
    border: 2px dashed rgb(148, 163, 184);
    background: rgb(248, 250, 252);
  }
  .nested {
    position: absolute;
    left: 52px;
    top: 26px;
    width: 96px;
    height: 54px;
    padding: 8px 10px;
    background: rgb(220, 38, 38);
  }
  .later {
    width: 96px;
    height: 54px;
    margin-top: -56px;
    margin-left: 64px;
    padding: 8px 10px;
    background: rgb(37, 99, 235);
  }
</style>
<div class="frame">
  <div class="anchor">
    <div class="nested"></div>
  </div>
  <div class="later"></div>
</div>
