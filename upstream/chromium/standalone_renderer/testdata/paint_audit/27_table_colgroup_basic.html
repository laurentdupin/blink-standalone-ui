<meta charset="utf-8">
<style>

  table {
    margin: 16px;
    width: 360px;
    border-collapse: collapse;
    background: #f8fafc;
  }
  col.first { background: #dcfce7; }
  col.second { background: #dbeafe; }
  td {
    border: 2px solid #334155;
    padding: 8px 12px;
  }

    <col class="second" data-debug-id="col-b">
  </colgroup>
  <tbody>
    <tr data-debug-id="row-1">
      <td data-debug-id="cell-a1">Alpha</td>
      <td data-debug-id="cell-b1">One</td>
    </tr>
    <tr data-debug-id="row-2">
