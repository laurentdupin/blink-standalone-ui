<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: white;
    }

    .stage {
      width: 320px;
      height: 220px;
      position: relative;
      overflow: hidden;
      background: rgb(246, 248, 252);
    }

    #card {
      position: absolute;
      left: 28px;
      top: 28px;
      width: 148px;
      height: 124px;
      border: 4px solid rgb(31, 41, 55);
      border-radius: 18px;
      box-sizing: border-box;
      overflow: hidden;
      background-color: white;
      background-image: url("17_assets/red_2x2.png");
      background-repeat: no-repeat;
      background-size: 52px 52px;
      background-position: 14px 14px;
      image-rendering: pixelated;
      transform-origin: left top;
    }

    #card::after {
      content: "";
      position: absolute;
      left: 70px;
      top: 26px;
      width: 74px;
      height: 70px;
      background: url("30_route_map.svg") center / contain no-repeat;
    }

    #card[data-effect="flat"] {
      opacity: 0.7;
      transform: translate(0, 0);
    }

    #card[data-effect="raised"] {
      opacity: 1;
      transform: translate(70px, 42px);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="card" data-effect="flat"></div>
  </div>
</body>
</html>
