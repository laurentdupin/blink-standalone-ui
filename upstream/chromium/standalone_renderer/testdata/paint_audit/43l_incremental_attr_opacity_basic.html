<!doctype html>
<html>
<head>
  <style>
    body {
      margin: 0;
      background: white;
    }

    .stage {
      width: 240px;
      height: 200px;
      padding: 24px;
      box-sizing: border-box;
      background: white;
    }

    #card {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      background: rgb(40, 80, 220);
      opacity: 1;
    }

    #card[data-alpha="low"] {
      opacity: 0.3;
    }

    #card[data-alpha="high"] {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="card" data-alpha="low"></div>
  </div>
</body>
</html>
