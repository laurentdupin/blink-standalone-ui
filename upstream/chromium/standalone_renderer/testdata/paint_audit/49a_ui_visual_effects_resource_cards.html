<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: white;
    }

    .stage {
      width: 560px;
      height: 260px;
      padding: 28px;
      box-sizing: border-box;
      background: rgb(245, 247, 251);
    }

    .cards {
      display: flex;
      gap: 34px;
    }

    .card {
      width: 180px;
      height: 168px;
      border: 4px solid rgb(31, 41, 55);
      border-radius: 20px;
      box-sizing: border-box;
      overflow: hidden;
      background-color: white;
      box-shadow: 0 18px 34px rgba(15, 23, 42, 0.24);
    }

    .png-card {
      opacity: 0.86;
      background-image: url("17_assets/red_2x2.png");
      background-repeat: repeat;
      background-size: 24px 24px;
      background-position: 8px 12px;
      image-rendering: pixelated;
    }

    .svg-card {
      opacity: 0.94;
      background: white url("30_route_map.svg") center / 210px 130px no-repeat;
    }

    .toolbar {
      height: 34px;
      border-radius: 999px;
      background: rgb(31, 41, 55);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
      opacity: 0.92;
      margin-bottom: 26px;
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="toolbar"></div>
    <div class="cards">
      <div class="card png-card" data-debug-id="png-effects-card"></div>
      <div class="card svg-card" data-debug-id="svg-effects-card"></div>
    </div>
  </main>
</body>
</html>
