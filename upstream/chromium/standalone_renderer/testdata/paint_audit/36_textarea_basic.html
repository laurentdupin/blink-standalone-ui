<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>36 textarea basic</title>
  <style>
    body {
      background: #f4f7fb;
      color: #1f2937;
      font: 16px "Segoe UI", Tahoma, sans-serif;
      margin: 0;
      padding: 24px;
    }

    label {
      display: grid;
      gap: 8px;
      width: 360px;
    }

    span {
      color: #475569;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    textarea {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: inherit;
      font: inherit;
      padding: 12px 14px;
    }
  </style>
</head>
<body>
  <label>
    <span>Case notes</span>
    <textarea rows="4">Plain textarea value</textarea>
  </label>
</body>
</html>
