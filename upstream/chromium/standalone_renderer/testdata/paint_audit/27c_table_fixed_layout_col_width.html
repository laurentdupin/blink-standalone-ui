<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; background: white; font: 14px Arial, sans-serif; }
  table {
    margin: 16px;
    width: 360px;
    table-layout: fixed;
    border-collapse: collapse;
    background: #f8fafc;
  }
  td {
    border: 2px solid #334155;
    padding: 8px 12px;
    overflow: hidden;
    white-space: nowrap;
  }
  td:first-child { background: #e0f2fe; }
  td:last-child { background: #fee2e2; }
</style>
<table data-debug-id="table">
  <colgroup data-debug-id="columns">
    <col data-debug-id="col-a" style="width: 120px">
    <col data-debug-id="col-b" style="width: 240px">
  </colgroup>
  <tbody>
    <tr data-debug-id="row-1">
      <td data-debug-id="cell-a1">Left</td>
      <td data-debug-id="cell-b1">Right fixed column content</td>
    </tr>
    <tr data-debug-id="row-2">
      <td data-debug-id="cell-a2">Narrow</td>
      <td data-debug-id="cell-b2">Wide</td>
    </tr>
  </tbody>
</table>
