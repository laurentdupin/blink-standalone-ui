<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 28px;
    background: #eef2f6;
    color: #1f2937;
    font: 16px "Segoe UI", Arial, sans-serif;
  }
  .field {
    display: grid;
    gap: 8px;
    width: 240px;
    padding: 18px;
    background: white;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
  }
  label {
    color: #475569;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  select {
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    color: inherit;
    font: inherit;
    padding: 12px 14px;
  }
</style>
</head>
<body>
  <div class="field" data-debug-id="select-field">
    <label for="state">Queue state</label>
    <select data-debug-id="target" id="state">
      <option selected>Needs review</option>
      <option>Open</option>
      <option>Resolved</option>
    </select>
  </div>
</body>
</html>
