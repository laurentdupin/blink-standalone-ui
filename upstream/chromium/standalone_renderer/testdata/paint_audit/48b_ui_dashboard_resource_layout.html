<!doctype html>
<meta charset="utf-8">
<style>
  html,
  body {
    margin: 0;
    background: white;
  }

  .app {
    box-sizing: border-box;
    width: 720px;
    height: 360px;
    padding: 18px;
    display: grid;
    grid-template-columns: 132px minmax(0, 1fr) 150px;
    grid-template-rows: 52px minmax(0, 1fr);
    gap: 14px;
    background: rgb(241, 245, 249);
  }

  .toolbar {
    grid-column: 1 / 4;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid rgb(203, 213, 225);
    border-radius: 10px;
    background: white;
  }

  .tool {
    width: 38px;
    height: 30px;
    border-radius: 8px;
    background: rgb(226, 232, 240);
  }

  .tool.primary {
    width: calc(38px + 22px);
    background-image: url("17_assets/red_2x2.png");
    background-repeat: no-repeat;
    background-position: 10px 7px;
    background-size: 16px 16px;
    image-rendering: pixelated;
  }

  .meter {
    flex: 1 1 auto;
    height: 12px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgb(37, 99, 235) 0 58%, rgb(226, 232, 240) 58% 100%);
  }

  .sidebar,
  .main,
  .inspector {
    min-height: 0;
    border: 1px solid rgb(203, 213, 225);
    border-radius: 12px;
    background: white;
  }

  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
  }

  .nav-dot {
    width: 64px;
    height: 18px;
    border-radius: 9px;
    background: rgb(226, 232, 240);
  }

  .nav-dot:nth-child(2) {
    width: 88px;
    background: rgb(191, 219, 254);
  }

  .main {
    box-sizing: border-box;
    padding: 16px;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    grid-template-rows: 138px 1fr;
    gap: 14px;
  }

  .map-card {
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    background: rgb(239, 246, 255);
  }

  .map-card img {
    position: absolute;
    left: -18px;
    top: 12px;
    width: 280px;
    height: 118px;
    object-fit: contain;
    transform: rotate(-3deg);
  }

  .image-card {
    border-radius: 14px;
    background-color: rgb(255, 255, 255);
    background-image: url("17_assets/red_2x2.png");
    background-repeat: repeat;
    background-size: 26px 26px;
    background-position: 9px 7px;
    overflow: hidden;
  }

  .grid-card {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    grid-column: 1 / 3;
  }

  .tile {
    border-radius: 10px;
    background: rgb(226, 232, 240);
  }

  .tile:nth-child(2) {
    background: rgb(219, 234, 254);
  }

  .tile:nth-child(3) {
    background: rgb(204, 251, 241);
  }

  .inspector {
    box-sizing: border-box;
    padding: 14px;
    display: grid;
    grid-template-rows: 76px 1fr;
    gap: 12px;
  }

  .masked-route {
    border-radius: 12px;
    background: white url("30_route_map.svg") center / 148px 76px no-repeat;
    -webkit-mask-image: linear-gradient(90deg, transparent 0 14px, #000 14px 124px, transparent 124px 100%);
    -webkit-mask-repeat: no-repeat;
    mask-image: linear-gradient(90deg, transparent 0 14px, #000 14px 124px, transparent 124px 100%);
    mask-repeat: no-repeat;
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 7px;
  }

  td {
    height: 18px;
    background: rgb(226, 232, 240);
  }

  td:first-child {
    width: 28px;
    border-radius: 9px 0 0 9px;
    background: rgb(37, 99, 235);
  }

  td:last-child {
    border-radius: 0 9px 9px 0;
  }
</style>
<main class="app">
  <header class="toolbar">
    <div class="tool primary"></div>
    <div class="tool"></div>
    <div class="tool"></div>
    <div class="meter"></div>
  </header>
  <aside class="sidebar">
    <div class="nav-dot"></div>
    <div class="nav-dot"></div>
    <div class="nav-dot"></div>
    <div class="nav-dot"></div>
  </aside>
  <section class="main">
    <div class="map-card"><img src="30_route_map.svg" alt=""></div>
    <div class="image-card"></div>
    <div class="grid-card">
      <div class="tile"></div>
      <div class="tile"></div>
      <div class="tile"></div>
    </div>
  </section>
  <aside class="inspector">
    <div class="masked-route"></div>
    <table>
      <tbody>
        <tr><td></td><td></td></tr>
        <tr><td></td><td></td></tr>
        <tr><td></td><td></td></tr>
      </tbody>
    </table>
  </aside>
</main>
