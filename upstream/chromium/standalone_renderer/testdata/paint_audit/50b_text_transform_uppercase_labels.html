<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: #17120d;
      color: #f7f2e8;
      font-family: Georgia, "Times New Roman", serif;
    }

    .panel {
      width: 560px;
      margin: 32px auto;
      padding: 24px;
      border: 1px solid rgba(250, 236, 205, 0.16);
      border-radius: 18px;
      background: rgba(20, 17, 13, 0.86);
    }

    .label {
      color: #cabda8;
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    strong {
      display: block;
      margin-top: 6px;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <section class="panel">
    <span class="label">Callback Name</span>
    <strong>PrintHello</strong>
  </section>
</body>
</html>
