<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 720px;
      background: rgb(244, 248, 252);
    }

    .strip {
      width: 100%;
      height: 96px;
      border-bottom: 1px solid rgb(203, 213, 225);
      background: rgb(219, 234, 254);
    }

    .strip:nth-child(2n) {
      background: rgb(254, 249, 195);
    }

    #fixed-card {
      position: fixed;
      left: 24px;
      top: 20px;
      width: 148px;
      height: 92px;
      border: 4px solid rgb(30, 41, 59);
      border-radius: 14px;
      overflow: hidden;
      background-image: url("43aa_panel_blocks.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }
  </style>
</head>
<body>
  <div class="strip"></div>
  <div class="strip"></div>
  <div class="strip"></div>
  <div class="strip"></div>
  <div class="strip"></div>
  <div class="strip"></div>
  <div class="strip"></div>
  <div id="fixed-card" data-debug-id="fixed-card"></div>
</body>
</html>
