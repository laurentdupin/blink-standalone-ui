<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: white;
    }

    .stage {
      width: 460px;
      height: 220px;
      padding: 28px;
      box-sizing: border-box;
      display: flex;
      gap: 28px;
      background: rgb(246, 248, 252);
    }

    .card {
      width: 170px;
      height: 150px;
      border-radius: 18px;
      overflow: hidden;
      border: 4px solid rgb(31, 41, 55);
      box-sizing: border-box;
      background-color: white;
    }

    .png-card {
      opacity: 0.86;
      background-image: url("17_assets/red_2x2.png");
      background-repeat: repeat;
      background-size: 20px 20px;
      image-rendering: pixelated;
    }

    .svg-card {
      opacity: 0.94;
      background: white url("30_route_map.svg") center / 210px 130px no-repeat;
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="card png-card" data-debug-id="opacity-png-card"></div>
    <div class="card svg-card" data-debug-id="opacity-svg-card"></div>
  </main>
</body>
</html>
