<!doctype html>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: white;
    font: 14px Arial, sans-serif;
  }

  .row {
    display: flex;
    align-items: stretch;
    gap: 16px;
    width: 360px;
    height: 160px;
    padding: 16px;
    background: #eef2ff;
  }

  .item {
    width: 72px;
    background: #2563eb;
    color: white;
  }

  .start {
    align-self: flex-start;
    height: 42px;
    background: #16a34a;
  }

  .center {
    align-self: center;
    height: 54px;
    background: #dc2626;
  }

  .end {
    align-self: flex-end;
    height: 38px;
    background: #9333ea;
  }
</style>
<div class="row" data-debug-id="flex-row">
  <div class="item stretch" data-debug-id="stretch">stretch</div>
  <div class="item start" data-debug-id="start">start</div>
  <div class="item center" data-debug-id="center">center</div>
  <div class="item end" data-debug-id="end">end</div>
</div>
