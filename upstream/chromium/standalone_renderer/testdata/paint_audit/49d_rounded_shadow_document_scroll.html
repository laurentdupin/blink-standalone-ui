<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rounded Shadow Document Scroll</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 201, 92, 0.18), transparent 28%),
        linear-gradient(145deg, #17120d, #2e2318 48%, #110e0a);
    }

    .page {
      width: 1040px;
      margin: 0 auto;
      padding: 220px 28px 72px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      min-height: 690px;
      overflow: hidden;
      border: 1px solid rgba(252, 244, 228, 0.14);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 248, 236, 0.06), transparent 34%),
        rgba(24, 20, 15, 0.9);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
      padding: 24px;
    }

    .stripe {
      height: 104px;
      margin-bottom: 20px;
      border-radius: 22px;
      background:
        linear-gradient(90deg, rgba(255, 191, 71, 0.44), rgba(122, 212, 255, 0.22)),
        rgba(255, 248, 236, 0.08);
      box-shadow: inset 0 0 0 1px rgba(255, 248, 236, 0.18);
    }

    .tile {
      height: 108px;
      margin-top: 20px;
      overflow: hidden;
      border: 1px solid rgba(250, 236, 205, 0.16);
      border-radius: 20px;
      background:
        radial-gradient(circle at 16% 26%, rgba(255, 248, 236, 0.24), transparent 26%),
        linear-gradient(135deg, rgba(80, 183, 151, 0.22), rgba(57, 95, 158, 0.18)),
        rgba(255, 248, 236, 0.05);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
    }

    .tile:nth-child(3) {
      background:
        radial-gradient(circle at 78% 30%, rgba(255, 248, 236, 0.22), transparent 24%),
        linear-gradient(135deg, rgba(255, 191, 71, 0.22), rgba(168, 86, 205, 0.18)),
        rgba(255, 248, 236, 0.05);
    }

    .tile:nth-child(4) {
      height: 156px;
      background:
        radial-gradient(circle at 35% 42%, rgba(255, 248, 236, 0.22), transparent 22%),
        linear-gradient(135deg, rgba(122, 212, 255, 0.2), rgba(255, 191, 71, 0.18)),
        rgba(255, 248, 236, 0.05);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="grid">
      <article class="panel">
        <div class="stripe"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </article>
      <article class="panel">
        <div class="stripe"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </article>
    </section>
  </main>
</body>
</html>
