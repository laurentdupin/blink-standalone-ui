<!doctype html>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: rgb(253, 246, 231);
    font-family: Georgia, "Times New Roman", serif;
  }

  .chip {
    position: fixed;
    top: 20px;
    right: 24px;
    padding: 10px 14px;
    color: white;
    background: linear-gradient(135deg, #f97316 0%, #9a3412 100%);
  }

  .content {
    width: 520px;
    margin: 80px auto;
    padding: 24px;
    border: 2px solid rgba(74, 55, 34, 0.16);
    background: #fffaf0;
  }
</style>
<div class="chip">fixed corner chip</div>
<main class="content">
  <h1>Fixed gradient anchor</h1>
  <p>The fixed chip background should paint at the viewport top-right corner.</p>
</main>
