<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(255, 196, 79, 0.12), transparent 28%),
        linear-gradient(160deg, #17120d 0%, #2f2419 48%, #120f0c 100%);
    }

    .page {
      width: 1120px;
      min-height: 1099px;
      margin: 0 auto;
      padding: 48px 28px 72px;
    }

    .panel {
      width: 490px;
      height: 420px;
      margin-top: 220px;
      border: 1px solid rgba(252, 244, 228, 0.12);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 248, 236, 0.04), transparent 26%),
        rgba(28, 23, 17, 0.94);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel"></section>
  </main>
</body>
</html>
