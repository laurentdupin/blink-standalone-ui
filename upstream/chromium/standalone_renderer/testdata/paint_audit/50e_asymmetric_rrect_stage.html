<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: rgb(247, 242, 234);
    }

    .stage {
      position: relative;
      box-sizing: border-box;
      width: 340px;
      height: 156px;
      margin: 32px;
      border: 4px solid rgb(28, 36, 82);
      border-radius: 24px 52px 28px 44px / 20px 58px 30px 40px;
      background: rgb(236, 230, 221);
    }

    .chip {
      position: absolute;
      top: 28px;
      width: 116px;
      height: 84px;
      box-sizing: border-box;
      border: 4px solid rgb(28, 36, 82);
      border-radius: 18px;
    }

    .chip.red {
      left: 28px;
      background: rgb(232, 72, 85);
    }

    .chip.blue {
      left: 112px;
      background: rgb(58, 109, 246);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="chip red"></div>
    <div class="chip blue"></div>
  </div>
</body>
</html>
