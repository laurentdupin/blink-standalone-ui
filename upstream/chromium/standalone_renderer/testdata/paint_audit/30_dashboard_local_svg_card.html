<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html,
    body {
      margin: 0;
      background: #0e1722;
      color: #dbe8f6;
      font-family: Arial, sans-serif;
    }

    .card {
      background: #131e2d;
      border: 1px solid #5c7d9f;
      border-radius: 14px;
      display: grid;
      gap: 16px;
      margin: 24px;
      padding: 18px;
      width: 380px;
    }

    h1 {
      font-size: 24px;
      line-height: 1;
      margin: 0;
    }

    .media-frame {
      background: #dce8f0;
      border-radius: 14px;
      padding: 14px;
    }

    img {
      display: block;
      height: auto;
      width: 100%;
    }
  </style>
</head>
<body>
  <article class="card" data-debug-id="card">
    <h1>Route board</h1>
    <figure class="media-frame" data-debug-id="container">
      <img data-debug-id="target" src="30_route_map.svg" alt="Route map">
    </figure>
  </article>
</body>
</html>
