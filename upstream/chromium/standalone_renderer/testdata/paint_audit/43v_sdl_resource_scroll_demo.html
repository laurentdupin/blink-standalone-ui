<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: white;
    }

    .page {
      width: 360px;
      min-height: 760px;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(180deg, rgb(246, 248, 252), white);
    }

    .panel {
      width: 280px;
      height: 140px;
      margin-bottom: 80px;
      border: 4px solid rgb(31, 41, 55);
      border-radius: 16px;
      box-sizing: border-box;
      overflow: hidden;
      background-color: white;
    }

    #tile-panel {
      background-image: url("17_assets/red_2x2.png");
      background-repeat: repeat;
      background-size: 32px 32px;
      image-rendering: pixelated;
    }

    #route-panel {
      background-image: url("30_route_map.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 260px 146px;
    }

    #masked-panel {
      background-image: url("30_route_map.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 260px 146px;
      -webkit-mask-image: linear-gradient(90deg, transparent 0 32px, #000 32px 228px, transparent 228px 100%);
      -webkit-mask-repeat: no-repeat;
      mask-image: linear-gradient(90deg, transparent 0 32px, #000 32px 228px, transparent 228px 100%);
      mask-repeat: no-repeat;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="panel" id="tile-panel"></div>
    <div class="panel" id="route-panel"></div>
    <div class="panel" id="masked-panel"></div>
  </main>
</body>
</html>
