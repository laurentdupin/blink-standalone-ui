<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 8px; background: white; }
  .fixture-target {
    display: grid;
    grid-template-columns: 160px 96px;
    gap: 16px;
    width: 292px;
    padding: 12px;
    background: #f8fafc;
    border: 2px solid #334155;
  }
  img {
    display: block;
    width: 160px;
    height: 120px;
  }
  .block {
    width: 96px;
    height: 120px;
    background: #0f766e;
  }
</style>
<div class="fixture-target" data-debug-id="grid">
  <img data-debug-id="target" alt="" src="31_simple_blocks.svg">
  <div class="block" data-debug-id="block"></div>
</div>
