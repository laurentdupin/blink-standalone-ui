<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: #f4ecdf;
      color: #31271c;
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: 920px;
      margin: 32px auto;
      padding: 20px;
      border: 2px solid #846c4d;
      border-radius: 18px;
      background: rgba(255, 250, 241, 0.94);
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }

    p {
      margin-top: 8px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>inline monospace should preserve paragraph sizing.</h1>
    <p>The top demo is a flex row with <code>align-items: flex-start</code>. The bottom demo is a flex column with the same container alignment.</p>
  </section>
</body>
</html>
