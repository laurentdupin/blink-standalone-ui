<!doctype html>
<meta charset="utf-8">
<style>
  html,
  body {
    margin: 0;
    background: white;
  }

  .workspace {
    box-sizing: border-box;
    width: 680px;
    min-height: 320px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: rgb(248, 250, 252);
  }

  .ribbon {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border: 1px solid rgb(203, 213, 225);
    border-radius: 12px;
    background: white;
  }

  .button {
    box-sizing: border-box;
    height: 38px;
    border: 3px solid rgb(51, 65, 85);
    border-radius: 10px;
    background: rgb(226, 232, 240);
  }

  .button.icon {
    width: 52px;
    background-color: white;
    background-image: url("17_assets/red_2x2.png");
    background-repeat: no-repeat;
    background-size: 20px 20px;
    background-position: center;
    image-rendering: pixelated;
  }

  .button.wide {
    width: calc(80px + 28px);
    background: linear-gradient(90deg, rgb(191, 219, 254), rgb(226, 232, 240));
  }

  .button.route {
    width: 96px;
    background: white url("30_route_map.svg") center / 110px 42px no-repeat;
    clip-path: inset(0 10px round 8px);
  }

  .content {
    display: grid;
    grid-template-columns: 1fr 150px;
    gap: 16px;
    min-height: 220px;
  }

  .board {
    box-sizing: border-box;
    padding: 14px;
    border: 1px solid rgb(203, 213, 225);
    border-radius: 14px;
    background: white;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .card {
    border-radius: 12px;
    background: rgb(241, 245, 249);
    overflow: hidden;
    min-height: 90px;
  }

  .card.image {
    background-color: white;
    background-image: url("17_assets/red_2x2.png");
    background-repeat: repeat;
    background-size: 22px 22px;
    background-position: 5px 9px;
  }

  .card.svg {
    background: white url("30_route_map.svg") center / 180px 92px no-repeat;
    transform: translate(8px, 4px) rotate(2deg);
  }

  .rail {
    display: grid;
    grid-template-rows: 88px 1fr;
    gap: 14px;
  }

  .preview {
    border-radius: 14px;
    background: white url("30_route_map.svg") center / 150px 82px no-repeat;
    -webkit-mask-image: linear-gradient(180deg, #000 0 64px, transparent 64px 100%);
    -webkit-mask-repeat: no-repeat;
    mask-image: linear-gradient(180deg, #000 0 64px, transparent 64px 100%);
    mask-repeat: no-repeat;
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border: 1px solid rgb(203, 213, 225);
    border-radius: 14px;
    background: white;
  }

  .row {
    height: 18px;
    border-radius: 9px;
    background: rgb(226, 232, 240);
  }

  .row:nth-child(2) {
    width: 72%;
    background: rgb(204, 251, 241);
  }

  .row:nth-child(3) {
    width: 84%;
    background: rgb(219, 234, 254);
  }
</style>
<main class="workspace">
  <nav class="ribbon">
    <div class="button icon"></div>
    <div class="button wide"></div>
    <div class="button route"></div>
    <div class="button icon"></div>
  </nav>
  <section class="content">
    <div class="board">
      <div class="card image"></div>
      <div class="card svg"></div>
      <div class="card"></div>
      <div class="card image"></div>
    </div>
    <aside class="rail">
      <div class="preview"></div>
      <div class="stack">
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
      </div>
    </aside>
  </section>
</main>
