<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>36b textarea multiline wrap</title>
  <style>
    body {
      background: #f4f7fb;
      color: #1f2937;
      font: 16px "Segoe UI", Tahoma, sans-serif;
      margin: 0;
      padding: 24px;
    }

    textarea {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: inherit;
      display: block;
      font: inherit;
      line-height: 1.45;
      padding: 12px 14px;
      width: 280px;
    }
  </style>
</head>
<body>
  <textarea rows="5">Hold release until the packet, route overlay, and diagnostics preview all agree on the manifest identifier.</textarea>
</body>
</html>
