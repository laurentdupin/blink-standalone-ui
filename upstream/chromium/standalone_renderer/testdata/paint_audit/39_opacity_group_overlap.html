<!doctype html>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: rgb(247, 242, 234);
  }
  .stage {
    margin: 40px;
    width: 260px;
    height: 150px;
    position: relative;
    opacity: 0.55;
    background: rgb(236, 230, 221);
    border: 4px solid rgb(29, 31, 36);
    border-radius: 24px;
  }
  .box {
    position: absolute;
    top: 32px;
    width: 110px;
    height: 76px;
    border: 4px solid rgb(29, 31, 36);
    border-radius: 16px;
  }
  .red {
    left: 28px;
    background: rgb(232, 72, 85);
  }
  .blue {
    left: 104px;
    background: rgb(58, 109, 246);
  }
</style>
<div class="stage" data-debug-id="opacity-group">
  <div class="box red"></div>
  <div class="box blue"></div>
</div>
