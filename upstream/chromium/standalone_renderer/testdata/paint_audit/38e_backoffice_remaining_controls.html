<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #eef2f6;
    color: #1f2937;
    font: 16px "Segoe UI", Arial, sans-serif;
  }
  .row {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    width: 760px;
    padding: 28px;
    background: white;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
  }
  .field {
    display: grid;
    gap: 8px;
  }
  label {
    color: #475569;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  input,
  select {
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    color: inherit;
    font: inherit;
    padding: 12px 14px;
  }
</style>
</head>
<body>
  <section class="row">
    <div class="field">
      <label for="date">Arrival date</label>
      <input data-debug-id="date" id="date" type="date" value="2026-03-19">
    </div>
    <div class="field">
      <label for="time">Time slot</label>
      <input data-debug-id="time" id="time" type="time" value="18:40">
    </div>
    <div class="field">
      <label for="state">Queue state</label>
      <select data-debug-id="state" id="state">
        <option selected>Needs review</option>
        <option>Open</option>
      </select>
    </div>
    <div class="field">
      <label for="priority">Priority</label>
      <select data-debug-id="priority" id="priority">
        <option>Low</option>
        <option selected>High</option>
      </select>
    </div>
  </section>
</body>
</html>
