<!doctype html>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: white;
  }
  .stage {
    position: relative;
    width: 300px;
    height: 170px;
    margin: 24px;
    overflow: hidden;
    border: 1px solid rgb(210, 218, 214);
    border-radius: 18px;
    background: rgb(246, 249, 246);
  }
  .parent {
    width: 94px;
    height: 94px;
    margin: 18px;
    padding-left: 12px;
    padding-top: 10px;
    border-radius: 18px;
    background: rgb(213, 220, 216);
    transform-origin: left top;
    transform: translate(104px, 18px) rotate(6deg);
  }
  .child {
    width: 28px;
    height: 28px;
    border-radius: 10px;
    background: rgb(255, 118, 73);
  }
</style>
<div class="stage">
  <div class="parent">
    <div class="child"></div>
  </div>
</div>
