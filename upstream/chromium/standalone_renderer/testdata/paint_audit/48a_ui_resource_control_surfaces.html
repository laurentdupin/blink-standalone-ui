<!doctype html>
<meta charset="utf-8">
<style>
  html,
  body {
    margin: 0;
    background: white;
  }

  .stage {
    box-sizing: border-box;
    width: 460px;
    height: 220px;
    padding: 24px;
    display: grid;
    grid-template-columns: 120px 150px 130px;
    gap: 20px;
    align-items: start;
    background: rgb(246, 248, 252);
  }

  .surface {
    box-sizing: border-box;
    position: relative;
    border: 3px solid rgb(31, 41, 55);
    border-radius: 12px;
    background-color: white;
    overflow: hidden;
  }

  #icon-button {
    width: 120px;
    height: 88px;
    background-image: url("17_assets/red_2x2.png");
    background-repeat: no-repeat;
    background-size: 52px 52px;
    background-position: 16px 16px;
    image-rendering: pixelated;
  }

  #select-surface {
    width: 150px;
    height: 88px;
    background: white url("30_route_map.svg") 18px 11px / 112px 64px no-repeat;
  }

  #select-surface::after {
    content: "";
    position: absolute;
    right: 14px;
    top: 34px;
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 9px solid rgb(31, 41, 55);
  }

  #masked-toggle {
    width: 130px;
    height: 88px;
    background: white url("30_route_map.svg") center / 150px 78px no-repeat;
    -webkit-mask-image: linear-gradient(90deg, transparent 0 18px, #000 18px 104px, transparent 104px 100%);
    -webkit-mask-repeat: no-repeat;
    mask-image: linear-gradient(90deg, transparent 0 18px, #000 18px 104px, transparent 104px 100%);
    mask-repeat: no-repeat;
  }

  #icon-button[data-state="on"] {
    border-color: rgb(185, 28, 28);
    background-position: 52px 22px;
  }

  #select-surface[data-state="on"] {
    border-color: rgb(37, 99, 235);
    background-position: 30px 19px;
  }

  #masked-toggle[data-state="on"] {
    border-color: rgb(15, 118, 110);
    transform: translateY(18px);
  }
</style>
<main class="stage">
  <div class="surface" id="icon-button" data-debug-id="icon-button" data-state="off"></div>
  <div class="surface" id="select-surface" data-debug-id="select-surface" data-state="off"></div>
  <div class="surface" id="masked-toggle" data-debug-id="masked-toggle" data-state="off"></div>
</main>
