<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
  margin: 0;
  background: #eef4fb;
  font: 16px Arial, sans-serif;
}
.wrap {
  padding: 24px;
}
label {
  display: block;
  margin: 0 0 8px;
  color: #123;
}
input {
  box-sizing: border-box;
  width: 280px;
  height: 42px;
  border: 1px solid #789;
  border-radius: 8px;
  padding: 8px 12px;
  background: white;
  color: #123;
  font: inherit;
}
</style>
</head>
<body>
<div class="wrap">
  <label for="search">Form controls should use real Blink element classes.</label>
  <input id="search" data-debug-id="search" type="search" value="layout display list images">
</div>
</body>
</html>
