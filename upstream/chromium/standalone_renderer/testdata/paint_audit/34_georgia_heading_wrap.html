<!doctype html>
<meta charset="utf-8">
<title>Georgia heading wrap</title>
<style>
  body {
    margin: 0;
    background: rgb(244, 247, 252);
    color: rgb(32, 37, 46);
    font-family: Georgia, "Times New Roman", serif;
  }

  .wrap {
    padding: 32px;
  }

  .panel {
    width: calc(260px + 20px);
    padding: 22px;
    border-radius: 24px;
    background: rgb(252, 253, 255);
    box-shadow: 0 18px 34px rgba(73, 93, 130, 0.12);
  }

  h2 {
    margin: 0;
    font-size: 24px;
    line-height: normal;
  }
</style>
<div class="wrap">
  <article class="panel" data-debug-id="card">
    <h2 data-debug-id="heading">Custom Property Math</h2>
  </article>
</div>
