<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>36c textarea placeholder</title>
  <style>
    body {
      background: #f4f7fb;
      color: #1f2937;
      font: 16px "Segoe UI", Tahoma, sans-serif;
      margin: 0;
      padding: 24px;
    }

    textarea {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: inherit;
      display: block;
      font: inherit;
      padding: 12px 14px;
      width: 340px;
    }
  </style>
</head>
<body>
  <textarea rows="4" placeholder="Add case notes"></textarea>
</body>
</html>
