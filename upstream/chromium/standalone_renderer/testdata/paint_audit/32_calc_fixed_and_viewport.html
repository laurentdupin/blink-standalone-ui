<!doctype html>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: white;
  }
  .target {
    margin: 24px;
    width: calc(260px + 20px);
    padding: calc(12px + 10px);
    border-radius: 24px;
    background: rgb(252, 253, 255);
  }
  .track {
    height: calc(12px * 3);
    padding: calc(8px + 4px);
    border-radius: 999px;
    background: rgb(226, 233, 244);
  }
  .bar {
    width: calc(30vw - 30px);
    height: 12px;
    border-radius: 999px;
    background: rgb(105, 145, 214);
  }
</style>
<div class="target" data-debug-id="target">
  <div class="track">
    <div class="bar"></div>
  </div>
</div>
