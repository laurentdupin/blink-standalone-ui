<!doctype html>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: white;
  }
  .stage {
    position: relative;
    width: 300px;
    height: 170px;
    margin: 24px;
    overflow: hidden;
    border: 1px solid rgb(210, 218, 214);
    border-radius: 18px;
    background: rgb(246, 249, 246);
  }
  .skew-chip {
    width: 56px;
    height: 56px;
    margin: 24px;
    border-radius: 14px;
    background: rgb(255, 118, 73);
    transform-origin: left top;
    transform: skewX(22deg);
  }
  .matrix-chip {
    width: 32px;
    height: 32px;
    margin: 18px 0 0 24px;
    border-radius: 10px;
    background: rgb(71, 128, 255);
    transform-origin: left top;
    transform: matrix(1.7, 0, 0, 1.7, 62, -42);
  }
</style>
<div class="stage">
  <div class="skew-chip"></div>
  <div class="matrix-chip"></div>
</div>
